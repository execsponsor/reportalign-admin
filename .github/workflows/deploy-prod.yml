name: Deploy to Production

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          lfs: false
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PROD }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/frontend"
          api_location: "api"
          output_location: "dist"
        env:
          VITE_ENTRA_CLIENT_ID: c303da83-4258-45fa-a7fc-8edd00e87c1f
          VITE_ENTRA_TENANT_ID: 968f235a-c65e-4e4c-b308-9dd27c1b5a30
          VITE_ENTRA_AUTHORITY: https://login.microsoftonline.com/968f235a-c65e-4e4c-b308-9dd27c1b5a30
          VITE_ENTRA_API_APP_ID: cde2b783-c437-4758-9308-d9474e27bc39
          # ADM-H1 fix: prod must use the same-origin SWA-managed /api (prod DB).
          # The api-client defaults to '/api' when VITE_API_BASE_URL is unset — the
          # previous override pointed the PROD portal at the NON-PROD API / pre-prod
          # DB, so admin actions on prod customers silently wrote to pre-prod.
          NODE_VERSION: '22'
